<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B0B" />
    <title>Valentina Sofía · Mis XV Años</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Great+Vibes&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./styles.css?v=15" />
  </head>
  <body>
    <main class="invitacion">
      <!-- ============ PORTADA ============ -->
      <section class="portada" aria-label="Portada" data-particles="14">
        <!-- Slot de foto: reemplaza ./assets/portada.jpg cuando tengas la imagen -->
        <img
          class="portada__foto"
          src="./assets/portada.jpg?v=3"
          alt="Foto de Valentina Sofía"
          decoding="async"
          fetchpriority="high"
        />

        <!-- Líneas guía (visibles solo en modo editor) -->
        <div class="guias" aria-hidden="true">
          <span class="guia guia--tercio guia--vt1"></span>
          <span class="guia guia--tercio guia--vt2"></span>
          <span class="guia guia--tercio guia--ht1"></span>
          <span class="guia guia--tercio guia--ht2"></span>
          <span class="guia guia--centro guia--vcenter"></span>
          <span class="guia guia--centro guia--hcenter"></span>
        </div>

        <!-- Veladura para legibilidad -->
        <div class="portada__velo" aria-hidden="true"></div>

        <!-- Marco fino premium -->
        <div class="portada__marco" aria-hidden="true"></div>

        <header class="portada__contenido">
          <div class="portada__top">
            <div class="movible" data-editable="kicker">
              <p class="portada__kicker">
                <span>X</span><span>V</span><span class="sep">·</span><span>A</span><span>Ñ</span><span>O</span><span>S</span>
              </p>
            </div>

            <div class="movible" data-editable="nombre">
              <h1 class="portada__nombre">
                <span class="linea">Valentina</span>
                <span class="linea linea--alt">Sofía</span>
              </h1>
            </div>
          </div>

          <div class="movible" data-editable="fecha">
            <p class="portada__fecha">
              <span>15</span>
              <span class="punto">·</span>
              <span>Noviembre</span>
              <span class="punto">·</span>
              <span>2026</span>
            </p>
          </div>
        </header>

        <div class="movible movible--scroll" data-editable="scroll">
          <button class="portada__scroll" type="button" aria-label="Desliza para continuar">
            <span class="portada__scroll-label">Desliza</span>
            <span class="portada__scroll-line" aria-hidden="true"></span>
          </button>
        </div>
      </section>

      <!-- ============ BIENVENIDA ============ -->
      <section class="bienvenida" aria-label="Bienvenida" data-particles="26">
        <div class="bienvenida__contenido">
          <div class="ornamento" aria-hidden="true" data-reveal data-reveal-delay="1">
            <span class="ornamento__linea"></span>
            <span class="ornamento__diamante"></span>
            <span class="ornamento__linea"></span>
          </div>

          <p class="bienvenida__cita">
            <span class="bienvenida__cita-linea" data-reveal data-reveal-delay="2">Hay momentos</span>
            <span class="bienvenida__cita-linea bienvenida__cita-linea--em" data-reveal data-reveal-delay="3">que merecen ser</span>
            <span class="bienvenida__cita-linea" data-reveal data-reveal-delay="4">recordados para siempre.</span>
          </p>

          <div class="ornamento" aria-hidden="true" data-reveal data-reveal-delay="5">
            <span class="ornamento__linea"></span>
            <span class="ornamento__diamante"></span>
            <span class="ornamento__linea"></span>
          </div>
        </div>
      </section>

      <!-- ============ CUENTA REGRESIVA ============ -->
      <section
        class="countdown"
        aria-label="Cuenta regresiva"
        data-evento="2026-11-15T20:00:00-06:00"
        data-particles="28"
      >
        <div class="countdown__contenido">
          <p class="countdown__kicker" data-reveal>
            <span>F</span><span>A</span><span>L</span><span>T</span><span>A</span><span>N</span>
          </p>

          <div class="countdown__grid" data-reveal data-reveal-delay="1">
            <div class="countdown__unidad">
              <span class="countdown__num" data-cd="dias">000</span>
              <span class="countdown__label">Días</span>
            </div>
            <span class="countdown__sep" aria-hidden="true">:</span>
            <div class="countdown__unidad">
              <span class="countdown__num" data-cd="horas">00</span>
              <span class="countdown__label">Horas</span>
            </div>
            <span class="countdown__sep" aria-hidden="true">:</span>
            <div class="countdown__unidad">
              <span class="countdown__num" data-cd="minutos">00</span>
              <span class="countdown__label">Min</span>
            </div>
            <span class="countdown__sep" aria-hidden="true">:</span>
            <div class="countdown__unidad">
              <span class="countdown__num" data-cd="segundos">00</span>
              <span class="countdown__label">Seg</span>
            </div>
          </div>

          <p class="countdown__pie" data-reveal data-reveal-delay="2">
            <span class="countdown__pie-em">para celebrar</span> este momento único
          </p>
        </div>
      </section>
    </main>

    <!-- Toast centrado al entrar/salir del modo editor -->
    <div class="edit-toast" hidden role="status" aria-live="polite">
      <span class="edit-toast__icon" aria-hidden="true"></span>
      <span class="edit-toast__text">Modo editor activado</span>
    </div>

    <!-- Barra del modo editor (oculta hasta activarse con 5 taps) -->
    <div class="edit-bar" hidden role="toolbar" aria-label="Modo editor">
      <span class="edit-bar__label">Modo editor · arrastra los elementos</span>
      <button type="button" class="edit-bar__btn" data-action="reset">Resetear</button>
      <button type="button" class="edit-bar__btn edit-bar__btn--primary" data-action="exit">Salir</button>
    </div>

    <script src="./script.js?v=15" defer></script>
  </body>
</html>
